worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;
    client_max_body_size 20m;   # network TSV / session JSON uploads

    server {
        listen 8080;

        location /api/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            # XSS defense-in-depth: blocks inline/injected scripts even if an
            # escaping fix is missed somewhere else (see the layer/channel-name
            # and node-url XSS fixes in frontend/src/).
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';" always;
        }
    }
}
