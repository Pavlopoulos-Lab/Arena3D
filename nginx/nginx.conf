worker_processes auto;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    sendfile on;
    client_max_body_size 20m;   # network TSV / session JSON uploads

    # A reverse proxy on the host connects to this container's published port;
    # Docker NATs that connection through the bridge network's gateway, so
    # $remote_addr is the container's gateway IP (e.g. 172.x.x.1), not
    # 127.0.0.1 or the real visitor, for every request — trust X-Forwarded-For
    # from that bridge range (and loopback, in case of host networking) to
    # recover the real client IP for rate limiting below. Safe here because
    # this container's port is only ever bound to the host's loopback
    # interface (see single-image-deployment.yml), so only the host's own
    # reverse proxy — never an arbitrary external client — can supply it.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;

    # Rate-limit the API: /api/layout and /api/topology run O(V*E) algorithms
    # (betweenness) and are unauthenticated, so a script could saturate CPU.
    # 20 r/s with burst 40 nodelay absorbs an interactive click-burst of a few
    # requests while throttling a sustained flood. Per client IP.
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

    server {
        listen 8080;

        location /api/ {
            limit_req zone=api burst=40 nodelay;
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
            # XSS defense-in-depth: blocks inline/injected scripts even if an
            # escaping fix is missed somewhere else (see the layer/channel-name
            # and node-url XSS fixes in frontend/src/).
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self';" always;
        }
    }
}
